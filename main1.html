<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .avatar-container {
        width: 300px;
        height: 300px;
        border: 2px solid transparent;
        border-radius: 50%;
        background:
          linear-gradient(#ffffff, #ffffff) padding-box,
          linear-gradient(to bottom, #b3b0b0 15%, #ffffff 50%, #78a4cb 100%)
            border-box;
        box-shadow:
          rgb(204, 219, 232) 3px 3px 6px 0px inset,
          #78a4cb -3px -3px 6px 1px inset;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="avatar-container">
      <img
        src="./images/avatar-removebg-preview.png"
        alt="Profile"
        class="avatar-img"
      />
    </div>
  </body>
</html>
